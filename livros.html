<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://localhost:5080; font-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gestão de livros da Biblioteca Escolar" />
    <title>Livros | Biblioteca Escolar</title>
    <link rel="icon" href="assets/images/logo-biblioteca.png" type="image/png" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>
  <body data-page="books">
    <a class="skip-link" href="#main-content">Ir para o conteúdo principal</a>
    <header id="site-header"></header>
    <div class="app-shell">
      <aside id="site-sidebar"></aside>
      <div class="app-column">
        <main id="main-content" class="page-shell">
          <div class="page-container">
            <header class="page-heading page-heading--actions">
              <div>
                <h1 class="page-heading__title">Livros</h1>
                <p class="page-heading__description">
                  Gerencie o acervo conectado à API.
                </p>
              </div>
              <button
                id="book-create"
                class="button button--primary"
                type="button"
              >
                Cadastrar livro
              </button>
            </header>

            <div
              id="page-message"
              class="page-message"
              role="status"
              hidden
            ></div>

            <section class="data-panel" aria-labelledby="books-list-title">
              <div class="data-panel__header">
                <div>
                  <h2 id="books-list-title" class="data-panel__title">
                    Acervo
                  </h2>
                  <p class="data-panel__description">
                    Busque por título, autor ou ISBN.
                  </p>
                </div>
                <form id="books-search-form" class="filter-form" role="search">
                  <label class="sr-only" for="books-search"
                    >Buscar livros</label
                  >
                  <input
                    id="books-search"
                    name="search"
                    type="search"
                    placeholder="Buscar livros"
                  />
                  <button class="button button--secondary" type="submit">
                    Buscar
                  </button>
                </form>
              </div>

              <p id="books-loading" class="loading-message" hidden>
                Carregando livros…
              </p>
              <div class="table-wrapper">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th scope="col">Título</th>
                      <th scope="col">Autor</th>
                      <th scope="col">ISBN</th>
                      <th scope="col">Categoria</th>
                      <th scope="col">Disponível/total</th>
                      <th scope="col">Ações</th>
                    </tr>
                  </thead>
                  <tbody id="books-table-body"></tbody>
                </table>
              </div>
              <div class="pagination" aria-label="Paginação dos livros">
                <button
                  id="books-previous"
                  class="button button--secondary"
                  type="button"
                >
                  Anterior
                </button>
                <span id="books-page-label" class="pagination__label"></span>
                <button
                  id="books-next"
                  class="button button--secondary"
                  type="button"
                >
                  Próxima
                </button>
              </div>
            </section>
          </div>
        </main>
        <footer id="site-footer"></footer>
      </div>
    </div>
    <button
      id="sidebar-overlay"
      class="sidebar-overlay"
      type="button"
      aria-label="Fechar menu lateral"
      tabindex="-1"
    ></button>

    <dialog
      id="book-dialog"
      class="form-dialog"
      aria-labelledby="book-dialog-title"
    >
      <form id="book-form" class="entity-form">
        <div class="form-dialog__header">
          <div>
            <h2 id="book-dialog-title">Cadastrar livro</h2>
            <p>Informe os dados do título e a quantidade de exemplares.</p>
          </div>
        </div>
        <div
          id="book-form-message"
          class="page-message page-message--error"
          role="alert"
          hidden
        ></div>
        <input name="id" type="hidden" />
        <input name="versao" type="hidden" />
        <p class="required-fields-note">
          <span aria-hidden="true">*</span> Campos obrigatórios
        </p>
        <div class="form-grid">
          <label class="field field--wide">
            <span
              >Título
              <span class="required-marker" aria-hidden="true">*</span></span
            >
            <input name="titulo" maxlength="200" required />
          </label>
          <label class="field">
            <span
              >Autor
              <span class="required-marker" aria-hidden="true">*</span></span
            >
            <input name="autor" maxlength="150" required />
          </label>
          <label class="field">
            <span>ISBN</span>
            <input name="isbn" maxlength="32" placeholder="978-0-306-40615-7" />
          </label>
          <label class="field">
            <span>Categoria</span>
            <input name="categoria" maxlength="80" />
          </label>
          <label class="field">
            <span
              >Quantidade total
              <span class="required-marker" aria-hidden="true">*</span></span
            >
            <input
              name="quantidadeTotal"
              type="number"
              min="1"
              max="1000000"
              required
            />
          </label>
        </div>
        <div class="form-actions">
          <button
            id="book-dialog-cancel"
            class="button button--secondary"
            type="button"
          >
            Cancelar
          </button>
          <button class="button button--primary" type="submit">Salvar</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
