<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Configurações da Biblioteca Escolar" />
    <title>Configurações | Biblioteca Escolar</title>
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>
  <body data-page="settings">
    <a class="skip-link" href="#main-content">Ir para o conteúdo principal</a>
    <header id="site-header"></header>
    <div class="app-shell">
      <aside id="site-sidebar"></aside>
      <div class="app-column">
        <main id="main-content" class="page-shell">
          <div class="page-container">
            <header class="page-heading">
              <h1 class="page-heading__title">Configurações</h1>
              <p class="page-heading__description">
                Ajuste as preferências do sistema.
              </p>
            </header>
            <div
              id="page-message"
              class="page-message"
              role="status"
              hidden
            ></div>
            <section
              class="data-panel settings-panel"
              aria-labelledby="connection-title"
            >
              <h2 id="connection-title" class="data-panel__title">
                Conexão com a API
              </h2>
              <p class="data-panel__description">
                Em produção, configure a URL no arquivo
                <code>assets/js/runtime-config.js</code>. O valor abaixo permite
                testar outra API neste navegador.
              </p>
              <form id="connection-form" class="entity-form settings-form">
                <label class="field field--wide">
                  <span>URL base da API</span>
                  <input name="apiBaseUrl" type="url" required />
                  <small
                    >Inclua o caminho de versão, por exemplo:
                    https://api.exemplo.com/api/v1</small
                  >
                </label>
                <label class="field field--wide">
                  <span>Access token temporário</span>
                  <input
                    name="accessToken"
                    type="password"
                    autocomplete="off"
                  />
                  <small
                    >Usado apenas nesta aba. Em produção, será preenchido pelo
                    login do Supabase.</small
                  >
                </label>
                <div class="form-actions">
                  <button
                    id="connection-reset"
                    class="button button--secondary"
                    type="button"
                  >
                    Restaurar padrão
                  </button>
                  <button class="button button--primary" type="submit">
                    Salvar e testar
                  </button>
                </div>
              </form>
            </section>
          </div>
        </main>
        <footer id="site-footer"></footer>
      </div>
    </div>
    <button
      id="sidebar-overlay"
      class="sidebar-overlay"
      type="button"
      aria-label="Fechar menu lateral"
      tabindex="-1"
    ></button>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
