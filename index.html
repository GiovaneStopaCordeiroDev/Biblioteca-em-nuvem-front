<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Visão geral do sistema de gerenciamento da Biblioteca Escolar"
    />
    <title>Visão Geral | Biblioteca Escolar</title>
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main-content">Ir para o conteúdo principal</a>
    <header id="site-header"></header>

    <div class="app-shell">
      <aside id="site-sidebar"></aside>

      <div class="app-column">
        <main id="main-content" class="dashboard-page">
          <section class="dashboard" aria-labelledby="dashboard-title">
            <header class="dashboard__header">
              <h1 id="dashboard-title" class="dashboard__title">Visão Geral</h1>
              <p class="dashboard__subtitle">
                Acompanhe as principais informações da Sala de Leitura.
              </p>
            </header>

            <section aria-label="Indicadores da biblioteca">
              <div id="summary-cards" class="summary-grid"></div>
            </section>

            <div class="dashboard__content-grid">
              <section class="panel recent-books" aria-labelledby="recent-books-title">
                <div class="panel__header">
                  <div>
                    <h2 id="recent-books-title" class="panel__title">Livros recentes</h2>
                    <p class="panel__description">
                      Últimos livros adicionados à biblioteca.
                    </p>
                  </div>
                  <button
                    class="panel__link"
                    type="button"
                    aria-label="Ver todos os livros recentes"
                  >
                    Ver todos
                  </button>
                </div>

                <ul id="recent-books-list" class="book-list" aria-live="polite"></ul>
              </section>

              <section class="panel quick-access" aria-labelledby="quick-access-title">
                <div class="panel__header panel__header--stacked">
                  <div>
                    <h2 id="quick-access-title" class="panel__title">Acesso rápido</h2>
                    <p class="panel__description">Acesse as principais funções.</p>
                  </div>
                </div>

                <div id="quick-actions" class="quick-actions"></div>
              </section>
            </div>
          </section>
        </main>

        <footer id="site-footer"></footer>
      </div>
    </div>

    <button
      id="sidebar-overlay"
      class="sidebar-overlay"
      type="button"
      aria-label="Fechar menu lateral"
      tabindex="-1"
    ></button>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
